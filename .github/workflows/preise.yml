name: Preise abrufen

on:
  schedule:
    # Reserve: Den eigentlichen Takt (alle 5 Minuten) gibt der Raspberry Pi vor, weil GitHub
    # zeitgesteuerte Abläufe oft stark verzögert oder auslässt.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Seite auch ohne Preisänderung neu veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.fetch.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Aktuelle Preise von Tankerkönig holen
        id: fetch
        env:
          TK_API_KEY: ${{ secrets.TK_API_KEY }}
          FORCE: ${{ inputs.erzwingen }}
        run: python3 scripts/fetch_current.py

      - name: Seite aktualisieren
        if: steps.fetch.outputs.publish == 'true'
        run: python3 scripts/build_site.py

      - name: Daten speichern
        if: steps.fetch.outputs.publish == 'true'
        run: |
          git config user.name "spritpreis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -q -m "Preise $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi

      # Versionskennung anhängen, damit Browser nach Änderungen nicht die alte app.js aus dem Zwischenspeicher nehmen
      - name: Versionskennung setzen
        if: steps.fetch.outputs.publish == 'true'
        run: sed -i "s#src=\"app.js\"#src=\"app.js?v=${GITHUB_SHA::8}-${GITHUB_RUN_ID}\"#" docs/index.html

      - uses: actions/configure-pages@v6
        if: steps.fetch.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.fetch.outputs.publish == 'true'
        with:
          path: docs

  veroeffentlichen:
    needs: abrufen
    if: needs.abrufen.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # GitHub findet das eben hochgeladene Paket gelegentlich nicht sofort: kurz warten, noch einmal versuchen
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

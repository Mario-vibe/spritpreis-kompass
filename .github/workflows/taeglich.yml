name: Marktdaten und Historie

on:
  schedule:
    - cron: "23 4 * * *"   # täglich gegen 5 bzw. 6 Uhr deutscher Zeit
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele vergangene Tage aus dem Tankerkönig-Datenbestand laden (z. B. 120 beim ersten Mal)"
        default: "2"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  taeglich:
    runs-on: ubuntu-latest
    steps:
      # Immer den neuesten Stand des Zweigs holen, nicht den Stand beim Anstoßen:
      # Wartet ein Lauf hinter einem anderen, hat der inzwischen neue Daten gespeichert.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Rohöl, Großhandel und Wechselkurs laden
        run: python3 scripts/fetch_market.py

      - name: Öffnungszeiten der Tankstellen holen
        env:
          TK_API_KEY: ${{ secrets.TK_API_KEY }}
        run: python3 scripts/fetch_details.py

      - name: Historische Preise übernehmen (falls Zugang eingerichtet)
        env:
          TK_HISTORY_URL: ${{ secrets.TK_HISTORY_URL }}
          TK_HISTORY_USER: ${{ secrets.TK_HISTORY_USER }}
          TK_HISTORY_PASS: ${{ secrets.TK_HISTORY_PASS }}
          TAGE: ${{ github.event.inputs.tage || '2' }}
        run: python3 scripts/import_history.py --days "$TAGE"

      - name: Seite aktualisieren
        run: python3 scripts/build_site.py

      - name: Daten speichern
        run: |
          git config user.name "spritpreis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -q -m "Marktdaten $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi

      # Versionskennung anhängen, damit Browser nach Änderungen nicht die alte app.js aus dem Zwischenspeicher nehmen
      - name: Versionskennung setzen
        # Kennung aus dem Inhalt von Seite und Programm: ändert sich nur, wenn sich der Code ändert.
        # Die Web-App vergleicht sie mit data/version.json und lädt eine veraltete Seite neu.
        run: |
          V=$(cat docs/index.html docs/app.js | sha256sum | cut -c1-10)
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#<meta name=\"app-version\" content=\"dev\">#<meta name=\"app-version\" content=\"$V\">#" docs/index.html
          echo "{\"v\":\"$V\"}" > docs/data/version.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  veroeffentlichen:
    needs: taeglich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # GitHub findet das eben hochgeladene Paket gelegentlich nicht sofort: kurz warten, noch einmal versuchen
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

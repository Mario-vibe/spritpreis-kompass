name: Pruefung Stooq (voruebergehend)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for s in cb.f ho.f rb.f eurusd; do
            echo "== $s"
            curl -s -m 30 -A "$UA" -o out.txt -w "HTTP %{http_code} %{size_download}B\n" "https://stooq.com/q/d/l/?s=$s&i=d" || echo "curl-Fehler $?"
            head -2 out.txt; echo "..."; tail -3 out.txt; echo
          done

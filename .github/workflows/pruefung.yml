name: Pruefung Datenquellen (voruebergehend)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 -o b.htm "https://www.eia.gov/dnav/pet/hist/RBRTED.htm" || true
          python3 - <<'PY'
          s=open('b.htm',encoding='latin-1').read()
          i=s.rfind('<tr>',0,s.rfind('</table>',0,s.rfind('B3')+5000))
          print(repr(s[i-1500:i+700]))
          PY

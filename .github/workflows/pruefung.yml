name: Pruefung Datenquellen (voruebergehend)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in RBRTED EER_EPD2DXL0_PF4_Y35NY_DPGD EER_EPMRU_PF4_Y35NY_DPGD; do
            echo "== $s"
            curl -s -m 60 -o $s.htm -w "HTTP %{http_code} %{size_download}B\n" "https://www.eia.gov/dnav/pet/hist/$s.htm" || echo "curl-Fehler $?"
            grep -o '<title>[^<]*' $s.htm | head -1
            sed 's/<[^>]*>/ /g' $s.htm | tr -s ' \t\r' ' ' | grep -E "20(25|26) [A-Z][a-z]{2}-" | tail -3
          done

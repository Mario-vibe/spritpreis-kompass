name: Pruefung EIA (voruebergehend)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 -L -o tie.htm "https://www.eia.gov/todayinenergy/prices.php" || echo "curl-Fehler tie"
          curl -s -m 60 -L -o spt.htm "https://www.eia.gov/dnav/pet/PET_PRI_SPT_S1_D.htm" || echo "curl-Fehler spt"
          curl -s -m 60 -L -o cpr.htm "https://www.eia.gov/about/copyrights_reuse.php" || echo "curl-Fehler cpr"
          python3 - <<'PY'
          import re,html
          def txt(f):
              try: s=open(f,encoding='utf-8',errors='replace').read()
              except Exception as e: return 'FEHLT '+str(e)
              s=re.sub(r'(?s)<script.*?</script>|<style.*?</style>','',s)
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',s)))
          t=txt('tie.htm'); i=t.find('Daily Prices')
          print('### TODAY IN ENERGY ###'); print(t[i:i+4000] if i>=0 else t[:3000])
          s=txt('spt.htm'); print('### SPOT TABLE ###')
          for k in ['Release Date','Next Release','Source','Thomson','Refinitiv','LSEG']:
              for m in re.finditer(k,s): print('...',s[max(0,m.start()-150):m.start()+250])
          c=txt('cpr.htm'); print('### COPYRIGHT ###')
          for k in ['public domain','Thomson','Refinitiv','LSEG','proprietary','third part','copyrighted']:
              for m in re.finditer(k,c,re.I): print('...',c[max(0,m.start()-250):m.start()+350])
          PY
